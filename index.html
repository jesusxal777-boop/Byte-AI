<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Byte AI — DreamByte Studios</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="theme-liquid-glass-dark">
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <div class="login-card glass">
        <div class="logo">
          <div class="logo-icon">B</div>
          <h1>Byte AI</h1>
          <p class="tagline">by DreamByte Studios</p>
        </div>
        <p class="login-desc">Asistente creativo de IA</p>
        <button id="btn-google" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuar con Google
        </button>
        <p class="theme-hint">Elige un tema después de entrar</p>
      </div>
    </div>

    <!-- Main Chat Screen -->
    <div id="chat-screen" class="screen hidden">
      <aside id="sidebar" class="glass">
        <div class="sidebar-header">
          <div class="logo-small">
            <span class="logo-icon-sm">B</span>
            <span>Byte AI</span>
          </div>
          <button id="btn-new-chat" class="btn-icon" title="Nueva conversación">+</button>
        </div>
        <div id="conversations-list"></div>
        <div class="sidebar-footer">
          <div class="theme-selector">
            <label>Tema</label>
            <select id="theme-select">
              <option value="liquid-glass-dark">Liquid Glass Oscuro</option>
              <option value="liquid-glass-light">Liquid Glass Claro</option>
              <option value="web2000-dark">Web 2000s Oscuro</option>
              <option value="web2000-light">Web 2000s Claro</option>
            </select>
          </div>
          <div class="user-info">
            <img id="user-avatar" src="" alt="" />
            <span id="user-name"></span>
            <button id="btn-logout" class="btn-text">Salir</button>
          </div>
        </div>
      </aside>

      <main id="chat-main">
        <header class="chat-header glass">
          <h2 id="chat-title">Nueva conversación</h2>
        </header>
        <div id="messages" class="messages"></div>
        <div class="input-area glass">
          <textarea id="user-input" placeholder="Escribe un mensaje..." rows="1"></textarea>
          <button id="btn-send" class="btn-send">Enviar</button>
        </div>
      </main>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
